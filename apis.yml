aid: proemion
name: Proemion
description: >-
  Proemion is a telematics provider for off-highway and heavy equipment OEMs,
  embedding data collection directly into the machine down to the ECU across CAN
  and Ethernet networks. Its API-first DataPlatform telematics cloud, DataPortal
  web application, Machine Companion app, ProInsights analytics, and Mixed Fleet
  Telematics let manufacturers and fleet operators obtain, configure, and analyze
  machine data. Proemion also ships Telematics Control Units (CAN/Ethernet
  gateways), CANlink displays, and wired CAN interfaces, and exposes a REST API,
  an AEMP/ISO 15143-3 standard export, and the CANlink mobile 10000 protobuf
  device API. It serves construction, agriculture, material handling, municipal
  services, and ground-support-equipment markets.
